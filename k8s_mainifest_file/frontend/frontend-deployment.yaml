apiVersion: apps/v1
kind: Deployment

metadata:
  name: blog-frontend
  namespace: three-tier
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend
  template:  #pod information
    metadata:
      labels: 
        app: frontend
    spec:
      containers:
        - name: blog-frontend-container # optional
          image: chetansingh673/blog-frontend:build-7
          imagePullPolicy: Always
          ports:
           - containerPort: 8080 
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5 