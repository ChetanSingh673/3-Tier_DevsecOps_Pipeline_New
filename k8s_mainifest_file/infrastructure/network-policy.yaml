# ---- NetworkPolicy: DB only accepts traffic from Backend ----

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blog-db-allow-backend-only
  namespace: three-tier
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 5432
          protocol: TCP

---

# ---- NetworkPolicy: Backend accepts traffic from Frontend only ----

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blog-backend-allow-frontend-only
  namespace: three-tier 
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 5000
          protocol: TCP