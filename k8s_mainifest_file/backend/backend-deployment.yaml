apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend 
  namespace: three-tier
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend 
  template:
    metadata:
      labels:
        app: backend 
    spec:
      initContainers:
        - name: wait-for-db
          image: chetansingh673/blog-backend:build-1
          command:
            - sh
            - -c 
            - |
              echo "waiting for the chetan_db:5432..."
              until nc -z blog-db-service 5432; do
                  echo "DB not ready, retrying in 3s.. "
                  sleep 3 
              done 
              echo "DB is ready!"   
      containers:
        - name: blog-backend-container                   
          image: chetansingh673/blog-backend:build-1
          ports:
            - containerPort: 5000 
          env:
            - name: PORT 
              value: "5000"  
            - name: DB_HOST
              value: "blog-db-service"  # DB service name 
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-db-secret   
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: postgres-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-db-secret
                  key: POSTGRES_DB   
