# ---- PostgreSQL Deployment ----
apiVersion: apps/v1
kind: StatefulSet  
metadata:
  name: blog-db
  namespace: three-tier 
  labels:
    app: database  
spec:
  serviceName: blog-db-service
  replicas: 1
  selector:
    matchLabels: 
        app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: blog-db-container
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials  
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readonlyRootFilesystem: false  # Postgres needs write access
            runAsNonRoot: false            # postgres image runs initdb as root then drops
          livenessProbe:
            exec:
              command: ["pg_ready", "-U", "POSTGRES_USER", "-d", "POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:    
              command: ["pg_ready", "-U", "POSTGRES_USER", "-d", "POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3     
      volumes: 
        - name: db-storage
          persistentVolumeClaim:
             claimName: blog-ebs-pvc  # This is the pvc name 
